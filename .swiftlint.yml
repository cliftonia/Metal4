included:
  - Jimothy
  - JimothyTests
  - JimothyUITests

disabled_rules:
  - todo # JIRA-tagged TODOs are permitted by the project's conventions

line_length:
  warning: 160
  error: 200

file_length:
  warning: 400
  error: 500

type_body_length:
  warning: 250
  error: 300

function_body_length:
  warning: 50
  error: 80

function_parameter_count:
  warning: 5
  error: 6

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - dt

trailing_comma:
  mandatory_comma: false
